name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --shm-size=1g   # Chromium shares big messages through /dev/shm; Docker's default 64 MB is far below any desktop's
    steps:
      - name: Install packages
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm electron xorg-server-xvfb fontconfig ttf-dejavu nss alsa-lib gtk3 libxss libxtst at-spi2-core libdrm mesa
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: bash -n install.sh && bash -n uninstall.sh && bash -n make-release.sh
      - name: JavaScript syntax
        run: for f in linux/*.js web/app.js web/bridge.js tests/*.js; do node --check "$f"; done
      - name: Dependencies
        run: npm ci --no-audit --no-fund && node node_modules/electron/install.js
      - name: Smoke test (the real app, with stand-in claude and whisper)
        run: xvfb-run -a node tests/smoke.js
      - name: Zoom test
        run: xvfb-run -a -s '-screen 0 1440x900x24' node tests/zoom.js
      - name: Caelestia theme test
        run: xvfb-run -a -s '-screen 0 1440x900x24' node tests/theme.js
      - name: Install, run the installed copy, uninstall
        run: |
          # each part's output goes to a file; on failure its last lines become annotations, so they're readable without the full log
          report() { echo "::error title=$1::$(tail -c 3000 "$2" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"; exit 1; }
          useradd -m tester && cp -r . /home/tester/mb && chown -R tester /home/tester/mb
          su tester -c 'cd ~/mb && ./install.sh --yes --no-open' > install.log 2>&1 || report install install.log
          cat /home/tester/.local/lib/mochiboard/app/install.json; echo "::notice title=Arch electron::$(pacman -Q $(pacman -Qq | grep -E "^electron[0-9]+$") 2>&1 | tr "\n" " ")"
          su tester -c 'cd ~/mb && MB_APP=$HOME/.local/lib/mochiboard/app xvfb-run -a node tests/smoke.js' > smoke.log 2>&1 || report installed-smoke smoke.log
          su tester -c 'cd ~/mb && ./uninstall.sh --purge' > uninstall.log 2>&1 || report uninstall uninstall.log
          test ! -e /home/tester/.local/bin/mochiboard
      - name: Build the AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: Mochiboard-x86_64.AppImage
          path: build/release/*.AppImage
